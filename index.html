<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Uptime Status Hub</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🟢 Uptime Status Hub</h1><p>Check a URL's availability instantly.</p><input id="u" placeholder="https://example.com" size="30"> <button onclick="go()">Check</button><div id="out"></div><script>async function go(){const u=document.getElementById('u').value;if(!u)return;const t=Date.now();try{await fetch(u,{mode:'no-cors'});document.getElementById('out').textContent=`✅ ${u} responded in ~${Date.now()-t}ms\nStatus: OPERATIONAL\n\nMulti-region probes, alerting & hosted status pages: commercial@ziontechgroup.com`}catch(e){document.getElementById('out').textContent=`❌ ${u} unreachable or blocked by CORS.\nFull monitoring bypasses this with server-side probes: commercial@ziontechgroup.com`}}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/uptime-status-hub">GitHub</a> · <a href="https://ziontechgroup.com/site-uptime-watchdog/">Uptime Watchdog</a></p></body></html>
